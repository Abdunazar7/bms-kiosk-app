# A SHORT jdk.net.unixdomain.tmpdir is required: the JDK NIO Selector self-pipe
# binds an AF_UNIX socket whose path must fit the ~108-char sun_path limit. The
# default Windows temp path is too long and fails with "Unable to establish
# loopback connection". Applies to the daemon/worker JVMs.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:/kiosk-tools/tmp -Djava.io.tmpdir=C:/kiosk-tools/tmp
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
